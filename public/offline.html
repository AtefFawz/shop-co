<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>SHOP.CO — غير متصل</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#f7f8fc;font-family:Arial,sans-serif;text-align:center}
    main{width:min(100%,420px);padding:36px 28px;border:1px solid #334155;border-radius:28px;background:#172033;box-shadow:0 24px 80px #05091466}
    .brand{font-size:26px;font-weight:900;letter-spacing:-1px}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 22px;border-radius:20px;background:#6678ed;font-size:27px;font-weight:900}
    h1{margin:22px 0 10px;font-size:22px}p{margin:0;color:#bac4d6;font-size:14px;line-height:1.9}
    button{margin-top:24px;min-height:46px;padding:0 22px;border:0;border-radius:14px;background:#6678ed;color:white;font-weight:800;font-size:13px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icons/shopco-192.png" width="64" height="64" alt="" style="display:block;width:64px;height:64px;margin:0 auto 22px;border-radius:20px">
    <div class="brand">SHOP.CO</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى. عند عودة الاتصال ستتمكن من متابعة التسوق.</p>
    <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
